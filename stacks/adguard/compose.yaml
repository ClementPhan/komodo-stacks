services:


  adguardhome-sync:
    image: ghcr.io/bakito/adguardhome-sync@sha256:a4e63e705c5602b7bdd5a9554615a78125521273a7aa5da5831517780a06aee4
    container_name: adguardhome-sync
    command: run --config /config/adguardhome-sync.yaml
    # ports:
    #   - 8080:8080
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
      - RUN_ON_START=false
      - CRON_SCHEDULE=0 * * * *
      - ORIGIN_URL=https://adguard.${TLD}
      - ORIGIN_USERNAME={{op://docker/adguard_home/username}}
      - ORIGIN_PASSWORD={{op://docker/adguard_home/password}}
      - ORIGIN_AUTO_SETUP=true
      - REPLICA1_URL=https://hub.${TLD}:3000
      - REPLICA1_USERNAME={{op://docker/home_assistant_daemon/username}}
      - REPLICA1_PASSWORD={{op://docker/home_assistant_daemon/password}}
      - REPLICA1_AUTO_SETUP=true
    labels:
      traefik.enable: true
      traefik.http.routers.adguard-sync.rule: Host(`adguard-sync.${TLD}`)
      traefik.http.routers.adguard-sync.entrypoints: websecure
      traefik.http.routers.adguard-sync.tls.certresolver: myresolver
      traefik.http.services.adguard-sync.loadbalancer.server.port: 8080
      # Homepage configuration
      homepage.group: Network
      homepage.name: Adguard Sync
      homepage.icon: adguard-home
      homepage.href: https://adguard-sync.${TLD}/
      homepage.description: DNS server syncing tool
    networks:
      - traefik_proxy

  adguard:
    image: adguard/adguardhome@sha256:e6f2b8bcda06064ab055b44933a4f0e983c35558b9cdb8d2e7ab1efcee36d890
    container_name: adguardhome
    restart: unless-stopped
    volumes:
      - /mnt/software/applications/adguard/adguard_home:/opt/adguardhome/work
      - /mnt/software/applications/adguard/adguard_sync/:/opt/adguardhome/conf
    ports:
      - 53:53/tcp
      - 53:53/udp
      # - 80:80/tcp
      # - 443:443/tcp
      # - 443:443/udp
      # - 3000:3000/tcp
      # - 853:853/tcp # DNS-over-TLS
      # - 853:853/udp # DNS-over-QUIC
      # - 6060:6060/tcp # Debuging
    labels:
      traefik.enable: true
      # Admin panel
      traefik.http.routers.adguard-admin.rule: Host(`adguard.${TLD}`)
      traefik.http.routers.adguard-admin.entrypoints: websecure
      traefik.http.routers.adguard-admin.tls.certresolver: myresolver
      traefik.http.routers.adguard-admin.service: adguard-admin
      traefik.http.services.adguard-admin.loadbalancer.server.port: 80
      # Admin panel configuration
      traefik.http.routers.adguard-config.rule: Host(`adguard_config.${TLD}`)
      traefik.http.routers.adguard-config.entrypoints: websecure
      traefik.http.routers.adguard-config.tls.certresolver: myresolver
      traefik.http.routers.adguard-config.service: adguard-config
      traefik.http.services.adguard-config.loadbalancer.server.port: 3000
      # Homepage configuration
      homepage.group: Network
      homepage.name: Adguard Home
      homepage.icon: adguard-home
      homepage.href: https://adguard.${TLD}/
      homepage.description: DNS server and filtering
    networks:
      - traefik_proxy

networks:
  traefik_proxy:
    external: true
    