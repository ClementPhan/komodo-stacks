name: audiobookshelf

services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.36.0@sha256:180acad33d69c99ed208676465d8edcb268fa46967735579a7810859885b1a8e 
    # ports:
    #   - 13378:80
    volumes:
      - /mnt/bulk/media/audio/audiobooks:/audiobooks
      - /mnt/bulk/media/audio/podcasts:/podcasts
      - /mnt/software/applications/audiobookshelf/config:/config
      - /mnt/software/applications/audiobookshelf/metadata:/metadata
    environment:
      - TZ=Europe/Paris
    restart: always
    labels:
      traefik.enable: true
      traefik.http.routers.audiobookshelf.rule: Host(`audiobookshelf.${TLD}`)
      traefik.http.routers.audiobookshelf.entrypoints: websecure
      traefik.http.routers.audiobookshelf.tls.certresolver: myresolver
      traefik.http.services.audiobookshelf.loadbalancer.server.port: 80
      # Homepage configuration
      homepage.group: Media & Data
      homepage.name: Audiobookshelf
      homepage.icon: audiobookshelf.svg
      homepage.href: https://audiobookshelf.${TLD}/
      homepage.description: Audiobook and podcast repository
    networks:
      traefik_proxy: {}
    
  libation:
    image: rmcrackan/libation:14.0.2@sha256:5d1f50a99f0af1aefc1941c81ad1e43cb3ad0f941f470c619d9ff186d44ad438
    restart: always
    user: 0:0
    volumes:
      - ${PWD}/config:/config
      - /mnt/bulk/media/audio/audiobooks/libation:/data
      - /mnt/software/applications/audiobookshelf/libation_db:/db
    environment:
      - SLEEP_TIME=177h

networks:
  traefik_proxy:
    external: true
      