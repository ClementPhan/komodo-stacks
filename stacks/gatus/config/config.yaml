# Anchors for default conditions and tests
default-conditions: &conditions
  conditions:
    - "[STATUS] == 200"
    - "[CERTIFICATE_EXPIRATION] > 48h"

adguard-dns-test: &dns-test
  dns:
    query-name: "healthcheck.adguardhome.test."
    query-type: "A"
  conditions:
    - "[DNS_RCODE] == NOERROR"

# Storage configuration
storage:
  type: sqlite
  path: /data/data.db

# Endpoints to monitor
endpoints:
  # DNS
  - name: DNS on Hub
    group: DNS
    url: "${HUB_IP}" # Address of the DNS server to use
    <<: *dns-test

  - name: DNS on Mammouth
    group: DNS
    url: "${MAMMOUTH_IP}" # Address of the DNS server to use
    <<: *dns-test

  # Administration
  - name: Komodo
    group: Administration
    url: "https://komodo.${TLD}"
    <<: *conditions

  - name: idrac
    group: Administration
    url: "https://idrac.${TLD}"
    <<: *conditions

  - name: Dozzle
    group: Administration
    url: "http://dozzle.${TLD}/healthcheck"
    <<: *conditions

  # Network and infrastructure
  - name: Box
    group: Network
    url: "http://box.${TLD}"
    conditions:
      - "[STATUS] == 200"

  - name: Traefik
    group: Network
    url: "http://traefik.${TLD}/api/version"
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"
      - "has([BODY].Version) == true"

  # Devices
  - name: Gul
    group: Devices
    url: "https://gul.${TLD}"
    <<: *conditions

  - name: PeaNUT
    group: Devices
    url: "http://peanut.${TLD}/api/ping"
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"
      - '[BODY] == "pong"'

  - name: Home Assistant
    group: Network
    url: "http://hub.${TLD}/api/"
    headers:
      Authorization: "Bearer ${HASS_TOKEN}"
    <<: *conditions
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"
      - "[BODY].message == API running."

  # Containers and services
  - name: Pocket ID
    group: Services
    url: "http://pocketid.${TLD}/healthz"
    conditions:
      - "[CERTIFICATE_EXPIRATION] > 48h"
      - "[STATUS] == 204"

  - name: AdGuard on Mammouth
    group: Services
    url: "https://adguard.${TLD}"
    <<: *conditions

  - name: AdGuard on Hub
    group: Services
    url: "https://hub.${TLD}:3000"
    conditions:
      - "[STATUS] == 401"
      - "[CERTIFICATE_EXPIRATION] > 48h"

  - name: AdGuard Sync
    group: Services
    url: "http://adguard-sync.${TLD}"
    <<: *conditions
