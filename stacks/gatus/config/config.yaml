storage:
  type: sqlite
  path: /data/data.db

endpoints:
  - name: Komodo
    group: core
    url: "https://komodo.{{op://docker/home_address/url/url}}"
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"

  - name: idrac
    group: internal
    url: "https://idrac.{{op://docker/home_address/url/url}}"
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"

  - name: Gul
    group: internal
    url: "https://gul.{{op://docker/home_address/url/url}}"
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"

  - name: Box
    group: Network
    url: "http://box.{{op://docker/home_address/url/url}}"
    conditions:
      - "[STATUS] == 200"

  - name: PeaNUT
    group: Network
    url: "http://peanut.{{op://docker/home_address/url/url}}/api/ping"
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"
      - "[BODY] == \"pong\""

  - name: Pocket ID
    group: Network
    url: "http://pocketid.{{op://docker/home_address/url/url}}/healthz"
    conditions:
      - "[STATUS] == 204"
      - "[CERTIFICATE_EXPIRATION] > 48h"
