storage:
  type: sqlite
  path: /data/data.db

endpoints:
  - name: Komodo
    group: core
    url: "https://komodo.{{op://docker/home_address/url/url}}"
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"

  - name: idrac
    group: internal
    url: "https://idrac.{{op://docker/home_address/url/url}}"
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"

  - name: Gul
    group: internal
    url: "https://gul.{{op://docker/home_address/url/url}}"
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"

  - name: Box
    group: Network
    url: "http://box.{{op://docker/home_address/url/url}}"
    conditions:
      - "[STATUS] == 200"
