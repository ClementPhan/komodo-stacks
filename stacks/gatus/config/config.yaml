storage:
  type: sqlite
  path: /data/data.db

endpoints:
  - name: Komodo
    group: core
    url: "https://komodo.${TLD}"
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"

  - name: idrac
    group: internal
    url: "https://idrac.${TLD}"
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"

  - name: Gul
    group: internal
    url: "https://gul.${TLD}"
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"

  - name: Box
    group: Network
    url: "http://box.${TLD}"
    conditions:
      - "[STATUS] == 200"

  - name: PeaNUT
    group: Network
    url: "http://peanut.${TLD}/api/ping"
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"
      - "[BODY] == \"pong\""

  - name: Pocket ID
    group: Network
    url: "http://pocketid.${TLD}/healthz"
    conditions:
      - "[STATUS] == 204"
      - "[CERTIFICATE_EXPIRATION] > 48h"

  - name: Traefik
    group: Network
    url: "http://traefik.${TLD}/api/version"
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"
      - "has([BODY].Version) == true"
