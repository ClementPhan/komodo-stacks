services:
  gatus:
    image: twinproduction/gatus:v5.37.0@sha256:094eb186e55235db367e90e9d56140e5897b7044c41de23cde4cc18e6da1242e
    restart: always
    # ports:
    #   - "8080:8080"
    environment:
      - TLD=${TLD}
      - MAIL_TLD=${MAIL_TLD}
      - MAMMOUTH_IP=${MAMMOUTH_IP}
      - HUB_IP=${HUB_IP}
      - HASS_TOKEN={{op://docker/home_assistant/auth/token}}
      - PUSHOVER_USER_KEY={{op://docker/pushover/user/user_key}}
      - PUSHOVER_APP_TOKEN={{op://docker/pushover/app_keys/gatus}}
      - GITHUB_TOKEN={{op://docker/github/gatus/token}}
      - PAPERLESS_TOKEN={{op://docker/paperless/gatus/token}}
    volumes:
      - /mnt/software/applications/gatus/data:/data/
      - ./config:/config
      - ${PWD}/lets-encrypt.pem:/etc/ssl/certs/lets-encrypt.pem:ro
    labels:
      traefik.enable: true
      traefik.http.routers.gatus.rule: Host(`gatus.${TLD}`)
      traefik.http.routers.gatus.entrypoints: websecure
      traefik.http.routers.gatus.tls.certresolver: myresolver
      traefik.http.services.gatus.loadbalancer.server.port: 8080
      # Homepage configuration
      homepage.group: Network
      homepage.name: Gatus
      homepage.icon: gatus
      homepage.href: https://gatus.${TLD}/
      homepage.description: Uptime monitor
    networks:
      - traefik_proxy

networks:
  traefik_proxy:
    external: true
    