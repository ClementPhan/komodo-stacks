services:
  gatus:
    image: twinproduction/gatus:v5.35.0@sha256:21609f31be8c4e680ce3004b24276305666239c99aff58391503f3fb6142f39d
    restart: always
    # ports:
    #   - "8080:8080"
    environment:
      - POSTGRES_USER=gatus_user
      - POSTGRES_PASSWORD={{op://docker/gatus/postgres/password}}
      - POSTGRES_DB=gatus
      - GATUS_LOG_LEVEL=DEBUG
    volumes:
      - ./config:/config
      - ${PWD}/lets-encrypt.pem:/etc/ssl/certs/lets-encrypt.pem:ro
    labels:
      traefik.enable: true
      traefik.http.routers.gatus.rule: Host(`gatus.{{op://docker/home_address/url/url}}`)
      traefik.http.routers.gatus.entrypoints: websecure
      traefik.http.routers.gatus.tls.certresolver: myresolver
      traefik.http.services.gatus.loadbalancer.server.port: 8080
      # Homepage configuration
      homepage.group: Network
      homepage.name: Gatus
      homepage.icon: gatus
      homepage.href: https://gatus.{{op://docker/home_address/url/url}}/
      homepage.description: Uptime monitor
    networks:
      - traefik_proxy
      - default
    depends_on:
      - postgres

  postgres:
    image: docker.io/library/postgres:18.3@sha256:a9abf4275f9e99bff8e6aed712b3b7dfec9cac1341bba01c1ffdfce9ff9fc34a
    volumes:
      - /mnt/software/applications/gatus/pgdata:/var/lib/postgresql
    # ports:
    #   - "5432:5432"
    environment:
      - POSTGRES_DB=gatus
      - POSTGRES_USER=gatus_user
      - POSTGRES_PASSWORD={{op://docker/gatus/postgres/password}}
    networks:
      - default

networks:
  traefik_proxy:
    external: true
  default:
    