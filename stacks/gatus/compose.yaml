services:
  gatus:
    image: twinproduction/gatus:v5.35.0@sha256:21609f31be8c4e680ce3004b24276305666239c99aff58391503f3fb6142f39d
    restart: always
    # ports:
    #   - "8080:8080"
    volumes:
      - /mnt/software/applications/gatus/data:/data/
      - ./config:/config
      - ${PWD}/lets-encrypt.pem:/etc/ssl/certs/lets-encrypt.pem:ro
    labels:
      traefik.enable: true
      traefik.http.routers.gatus.rule: Host(`gatus.{{op://docker/home_address/url/url}}`)
      traefik.http.routers.gatus.entrypoints: websecure
      traefik.http.routers.gatus.tls.certresolver: myresolver
      traefik.http.services.gatus.loadbalancer.server.port: 8080
      # Homepage configuration
      homepage.group: Network
      homepage.name: Gatus
      homepage.icon: gatus
      homepage.href: https://gatus.{{op://docker/home_address/url/url}}/
      homepage.description: Uptime monitor
    networks:
      - traefik_proxy

networks:
  traefik_proxy:
    external: true
    