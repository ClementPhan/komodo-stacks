global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    basic_auth:
      username: admin
      password: {{op://docker/prometheus/password}}
    static_configs:
      - targets:
        - 'prometheus.{{op://docker/home_address/url/url}}'
