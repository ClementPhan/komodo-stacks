services:
  uptime-kuma:
    image: louislam/uptime-kuma:2@sha256:7337368a77873f159435de9ef09567f68c31285ed5f951dec36256c4b267ee44
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      NODE_EXTRA_CA_CERTS: /etc/lets-encrypt.pem
    # ports:
    #   - 8945:8945
    volumes:
      - /mnt/software/applications/uptime-kuma/data:/app/data
      - ${PWD}/lets-encrypt.pem:/etc/lets-encrypt.pem:ro
    labels:
      traefik.enable: true
      traefik.http.routers.uptime-kuma.rule: Host(`uptime-kuma.{{op://docker/home_address/url/url}}`)
      traefik.http.routers.uptime-kuma.entrypoints: websecure
      traefik.http.routers.uptime-kuma.tls.certresolver: myresolver
      traefik.http.services.uptime-kuma.loadbalancer.server.port: 3001
      # Homepage configuration
      homepage.group: Network
      homepage.name: Uptime-Kuma
      homepage.icon: uptime-kuma
      homepage.href: https://uptime-kuma.{{op://docker/home_address/url/url}}/
      homepage.description: Uptime monitor
    networks:
      traefik_proxy: {}


networks:
  traefik_proxy:
    external: true