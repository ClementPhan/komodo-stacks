services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:0.25.0@sha256:6506480a3dfadd2cc885fa97b32d11b0ee28ec58629fa34a76afdb4ac540c7fc
#   image: ghcr.io/hay-kot/homebox:latest-rootless
    container_name: homebox
    restart: unless-stopped
    environment:
    - HBOX_LOG_LEVEL=info
    - HBOX_LOG_FORMAT=text
    - HBOX_WEB_MAX_UPLOAD_SIZE=10
    - HBOX_OIDC_ENABLED=true
    - HBOX_OIDC_ISSUER_URL=https://pocketid.{{op://docker/home_address/url/url}}
    - HBOX_OIDC_CLIENT_ID={{op://docker/pocket-id/homebox/client_id}}
    - HBOX_OIDC_CLIENT_SECRET={{op://docker/pocket-id/homebox/client_secret}}
    # Required if behind a reverse proxy so HomeBox detects HTTPS correctly
    - HBOX_OPTIONS_TRUST_PROXY=true
    # Optional: require verified email from Pocket ID
    # - HBOX_OIDC_VERIFY_EMAIL=true
    # Optional: auto-redirect to OIDC login (bypass local login screen)
    # - HBOX_OIDC_AUTO_REDIRECT=true
    # Optional: disable username/password login completely
    # - HBOX_OPTIONS_ALLOW_LOCAL_LOGIN=false
    volumes:
      - /mnt/software/applications/homebox/data:/data/
    # ports:
    #   - 3100:7745
    labels:
      # Traefik configuration
      traefik.enable: true
      traefik.http.routers.homebox.rule: Host(`homebox.{{op://docker/home_address/url/url}}`)
      traefik.http.routers.homebox.entrypoints: websecure
      traefik.http.routers.homebox.tls.certresolver: myresolver
      traefik.http.services.homebox.loadbalancer.server.port: 7745
      docker-volume-backup.stop-during-backup: true
      # Homepage configuration
      homepage.group: Home Management
      homepage.name: homebox
      homepage.icon: homebox.svg
      homepage.href: https://homebox.{{op://docker/home_address/url/url}}/
      homepage.description: Asset tracking
    networks:
      traefik_proxy: {}

networks:
  traefik_proxy:
    external: true

volumes:
   homebox-data: