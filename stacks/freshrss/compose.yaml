services:
  freshrss:
    image: freshrss/freshrss:1.28.1@sha256:9100f649f5c946f589f54cdb9be7a65996528f48f691ef90eb262a0e06e5a522
    container_name: freshrss
    hostname: freshrss
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
    volumes:
      - /mnt/software/applications/freshrss/data:/var/www/FreshRSS/data
      - /mnt/software/applications/freshrss/extensions:/var/www/FreshRSS/extensions
    environment:
      TZ: Europe/Paris
      CRON_MIN: '3,33'
      TRUSTED_PROXY: 10.0.1.200
      FRESHRSS_INSTALL: |-
        --api-enabled
        --base-url ${BASE_URL}
        --default-user {{op://docker/freshrss/username}}
        --language en
      FRESHRSS_USER: |-
        --api-password ${ADMIN_API_PASSWORD}
        --email ${ADMIN_EMAIL}
        --language en
        --password ${ADMIN_PASSWORD}
        --user {{op://docker/freshrss/username}}
    # ports:
      # If you want to open a port 8080 on the local machine:
      # - "8080:80"
    labels:
    # Traefik configuration
      traefik.enable: true
      traefik.http.routers.freshrss.rule: Host(`freshrss.{{op://docker/home_address/url/url}}`)
      traefik.http.routers.freshrss.entrypoints: websecure
      traefik.http.routers.freshrss.tls.certresolver: myresolver
      traefik.http.services.freshrss.loadbalancer.server.port: 80
      docker-volume-backup.stop-during-backup: true
      # Homepage configuration
      homepage.group: Media & Data
      homepage.name: FreshRSS
      homepage.icon: freshrss
      homepage.href: https://freshrss.{{op://docker/home_address/url/url}}/
      homepage.description: RSS feed reader


    healthcheck:
      test: ["CMD", "cli/health.php"]
      timeout: 10s
      start_period: 60s
      start_interval: 11s
      interval: 75s
      retries: 3
    networks:
      traefik_proxy: {}

networks:
  traefik_proxy:
    external: true
