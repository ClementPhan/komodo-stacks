services:
  freshrss:
    image: freshrss/freshrss:1.29.0@sha256:cca8988d05cd449e1c6c69405971b1e6fc2c2116ceeb45c9fa3fc33837997a75
    container_name: freshrss
    hostname: freshrss
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
    volumes:
      - /mnt/software/applications/freshrss/data:/var/www/FreshRSS/data
      - /mnt/software/applications/freshrss/extensions:/var/www/FreshRSS/extensions
    environment:
      TZ: Europe/Paris
      CRON_MIN: '21,51'
      TRUSTED_PROXY: 10.0.1.200
      FRESHRSS_INSTALL: |-
        --api-enabled
        --base-url https://freshrss.${TLD}
        --default-user {{op://docker/freshrss/username}}
        --language en
      FRESHRSS_USER: |-
        --api-password {{op://docker/freshrss/api/api_password}}
        --email {{op://docker/email/email/email}}
        --language en
        --password {{op://docker/freshrss/password}}
        --user {{op://docker/freshrss/username}}
      OIDC_ENABLED: 1
      OIDC_CLIENT_ID: {{op://docker/pocket-id/freshrss/client_id}}
      OIDC_CLIENT_SECRET: {{op://docker/pocket-id/freshrss/client_secret}}
      OIDC_PROVIDER_METADATA_URL: https://pocketid.${TLD}/.well-known/openid-configuration
      OIDC_SCOPES: openid email profile
      OIDC_X_FORWARDED_HEADERS: X-Forwarded-Proto X-Forwarded-Host
      OIDC_REMOTE_USER_CLAIM: preferred_username
      OIDC_CLIENT_CRYPTO_KEY: {{op://docker/freshrss/config/oidc_client_crypto_key}}
    # ports:
      # If you want to open a port 8080 on the local machine:
      # - "8080:80"
    labels:
    # Traefik configuration
      traefik.enable: true
      traefik.http.routers.freshrss.rule: Host(`freshrss.${TLD}`)
      traefik.http.routers.freshrss.entrypoints: websecure
      traefik.http.routers.freshrss.tls.certresolver: myresolver
      traefik.http.services.freshrss.loadbalancer.server.port: 80
      docker-volume-backup.stop-during-backup: true
      # Homepage configuration
      homepage.group: Media & Data
      homepage.name: FreshRSS
      homepage.icon: freshrss
      homepage.href: https://freshrss.${TLD}/
      homepage.description: RSS feed reader


    healthcheck:
      test: ["CMD", "cli/health.php"]
      timeout: 10s
      start_period: 60s
      start_interval: 11s
      interval: 75s
      retries: 3
    networks:
      traefik_proxy: {}

networks:
  traefik_proxy:
    external: true
