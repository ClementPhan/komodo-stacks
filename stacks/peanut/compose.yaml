services:
  peanut:
    image: brandawg93/peanut:6.0.0@sha256:6629dce915da8b313f08b2e73dd2e54b60e7c0f642c21a8ebc37fe0a820bf41e
    container_name: PeaNUT
    restart: unless-stopped
    volumes:
      - /mnt/software/applications/peanut/config:/config
    # ports:
    #   - 8080:8080
    environment:
      - WEB_PORT=8080
    labels:
      # Traefik configuration
      traefik.enable: true
      traefik.http.routers.peanut.rule: Host(`peanut.${TLD}`)
      traefik.http.routers.peanut.entrypoints: websecure
      traefik.http.routers.peanut.tls.certresolver: myresolver
      traefik.http.services.peanut.loadbalancer.server.port: 8080
      docker-volume-backup.stop-during-backup: true
      # Homepage configuration
      homepage.group: Network
      homepage.name: PeaNUT
      homepage.icon: peanut.svg
      homepage.href: https://peanut.${TLD}/
      homepage.description: UPS status
    networks:
      traefik_proxy: {}

networks:
  traefik_proxy:
    external: true