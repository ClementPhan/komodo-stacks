services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.19.2@sha256:3ee23895d6a3adb5dd5de801a4fd31fc31b960e6dfbea9b5200e33cf477695eb
    restart: unless-stopped
    env_file: pocket_id.env
    environment:
      - APP_URL=https://pocketid.${TLD}
    # ports:
    #   - 1411:1411
    volumes:
      - /mnt/software/applications/auth/pocket_id_data:/app/data
    labels:
      traefik.enable: true
      traefik.http.routers.pocketid.rule: Host(`pocketid.${TLD}`)
      traefik.http.routers.pocketid.entrypoints: websecure
      traefik.http.routers.pocketid.tls.certresolver: myresolver
      traefik.http.services.pocketid.loadbalancer.server.port: 1411
      # Homepage configuration
      homepage.group: Network
      homepage.name: Pocket-ID
      homepage.icon: pocket-id
      homepage.href: https://pocketid.${TLD}/
      homepage.description: Authentication service
    # Optional healthcheck
    healthcheck:
      test: [ "CMD", "/app/pocket-id", "healthcheck" ]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    networks:
      - traefik_proxy

networks:
  traefik_proxy:
    external: true
    