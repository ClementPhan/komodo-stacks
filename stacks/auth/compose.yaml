services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.7.0@sha256:45bdeaf3fcd6d07cf8721e98785d93324bb8e65b586498874c05a3d489c8094e
    restart: unless-stopped
    env_file: pocket_id.env
    # ports:
    #   - 1411:1411
    volumes:
      - /mnt/software/applications/auth/pocket_id_data:/app/data
    labels:
      traefik.enable: true
      traefik.http.routers.pocketid.rule: Host(`pocketid.{{op://docker/home_address/url/url}}`)
      traefik.http.routers.pocketid.entrypoints: websecure
      traefik.http.routers.pocketid.tls.certresolver: myresolver
      traefik.http.services.pocketid.loadbalancer.server.port: 1411
      # Homepage configuration
      homepage.group: Network
      homepage.name: Pocket-ID
      homepage.icon: pocket-id
      homepage.href: https://pocketid.{{op://docker/home_address/url/url}}/
      homepage.description: Authentication service
    # Optional healthcheck
    healthcheck:
      test: [ "CMD", "/app/pocket-id", "healthcheck" ]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    networks:
      - traefik_proxy

networks:
  traefik_proxy:
    external: true
    