services:
  influxdb2:
    image: influxdb:2
    # ports:
    #   - 8086:8086
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME_FILE: /run/secrets/influxdb2-admin-username
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/influxdb2-admin-password
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE: /run/secrets/influxdb2-admin-token
      DOCKER_INFLUXDB_INIT_ORG: home
      DOCKER_INFLUXDB_INIT_BUCKET: default
    secrets:
      - influxdb2-admin-username
      - influxdb2-admin-password
      - influxdb2-admin-token
    volumes:
      - /mnt/bulk/media/applications/influxdb/data:/var/lib/influxdb2
      - /mnt/software/applications/influxdb/config:/etc/influxdb2

    labels:
      traefik.enable: true
      traefik.http.routers.influxdb.rule: Host(`influxdb.${TLD}`)
      traefik.http.routers.influxdb.entrypoints: websecure
      traefik.http.routers.influxdb.tls.certresolver: myresolver
      traefik.http.services.influxdb.loadbalancer.server.port: 8086
      # Homepage configuration
      homepage.group: Media & Data
      homepage.name: InfluxDB
      homepage.icon: influxdb
      homepage.href: https://influxdb.${TLD}/
      homepage.description: Time series database
    networks:
      traefik_proxy: {}

secrets:
  influxdb2-admin-username:
    file: ${PWD}/influxdb2-admin-username
  influxdb2-admin-password:
    file: ${PWD}/influxdb2-admin-password
  influxdb2-admin-token:
    file: ${PWD}/influxdb2-admin-token

networks:
  traefik_proxy:
    external: true
