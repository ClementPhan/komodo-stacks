# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: ["main", "renovate/**"]
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains two jobs
  validate-stacks:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Inject secrets
        run: bash tests/inject_dummy_secrets.sh

      - name: Validate compose stacks
        env:
          TLD: example.com
        run: bash tests/validate_compose_files.sh

  validate-uptime-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test uptime monitoring coverage
        run: python3 -m unittest 'tests/test_uptime_monitoring.py'

  validate-traefik-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test Traefik routing
        run: python3 -m unittest 'tests/test_traefik.py'

  validate-stack-syncs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test stack sync coverage
        run: python3 -m unittest 'tests/test_stack_syncs.py'

  validate-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Lint Python files
        run: ruff check tests/

  validate-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install yamllint
        run: python -m pip install yamllint
      - name: Inject dummy secrets for YAML parsing
        run: bash tests/inject_dummy_secrets.sh
      - name: Lint YAML files
        run: yamllint -c .yamllint .github/workflows stacks
